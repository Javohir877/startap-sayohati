<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Startap Sayohati</title>
<style>
:root{
  --bg:#f5f6fa; --card:#ffffff; --ink:#1c2033; --muted:#5d6480; --line:#e2e5ef;
  --accent:#4f46e5; --accent-ink:#ffffff; --accent-soft:#eceafd;
  --good:#15803d; --good-soft:#e4f6ea; --bad:#b91c1c; --bad-soft:#fde8e8; --warn:#b45309; --warn-soft:#fef3e2;
  --shadow:0 2px 10px rgba(20,25,60,.07);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#11131c; --card:#1b1e2b; --ink:#e8eaf3; --muted:#9aa1bd; --line:#2c3043;
    --accent:#8b85ff; --accent-ink:#11131c; --accent-soft:#2a2850;
    --good:#4ade80; --good-soft:#163222; --bad:#f87171; --bad-soft:#3a1a1d; --warn:#fbbf24; --warn-soft:#3a2d12;
    --shadow:0 2px 10px rgba(0,0,0,.35);
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
header{background:var(--card);border-bottom:1px solid var(--line);padding:12px 16px;position:sticky;top:0;z-index:5}
.hwrap{max-width:1100px;margin:0 auto;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.logo{font-weight:700;font-size:18px}
.logo span{color:var(--accent)}
.stats{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:4px 10px;font-size:13px;white-space:nowrap}
.chip b{font-variant-numeric:tabular-nums}
.hbtns{display:flex;gap:6px}
.teams{max-width:1100px;margin:10px auto 0;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.teams:empty{display:none}
@media (max-width:640px){.teams{grid-template-columns:1fr}}
.team{border:2px solid var(--line);border-radius:12px;padding:6px 12px;background:var(--bg);opacity:.75;transition:all .2s;min-width:0}
.team .tn{font-weight:700;display:flex;align-items:center;gap:6px}
.team .tn i{width:12px;height:12px;border-radius:50%;flex:none}
.team .tm{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.team .ts{font-size:12px;margin-top:2px;font-variant-numeric:tabular-nums}
.team.now{opacity:1;background:var(--card);box-shadow:var(--shadow)}
.team.now .tn::after{content:"● navbatda";font-size:11px;font-weight:600;margin-left:auto;color:var(--good)}
main{max-width:1100px;margin:0 auto;padding:16px;display:grid;grid-template-columns:1fr 320px;gap:16px}
@media (max-width:860px){main{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow)}
.side .card{margin-bottom:16px}
h1{font-size:28px;margin:0 0 8px} h2{font-size:22px;margin:0 0 6px} h3{font-size:16px;margin:0 0 8px}
p{margin:8px 0}
.muted{color:var(--muted)}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
.steps{display:flex;gap:4px;margin:0 0 16px;flex-wrap:wrap}
.step{flex:1;min-width:70px;text-align:center;font-size:12px;padding:6px 4px;border-radius:8px;background:var(--bg);border:1px solid var(--line);color:var(--muted)}
.step.done{background:var(--good-soft);color:var(--good);border-color:transparent}
.step.now{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:700}
.info{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:14px 0}
.info div{background:var(--bg);border-radius:10px;padding:10px 12px;font-size:14px}
.info div b{display:block;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;margin-bottom:2px}
.opts{display:grid;gap:10px;margin-top:14px}
.opt{display:block;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:14px;color:var(--ink);font:inherit;cursor:pointer;transition:border-color .15s,transform .1s}
.opt:hover{border-color:var(--accent);transform:translateY(-1px)}
.opt .t{font-weight:700;display:block}
.opt .d{font-size:14px;color:var(--muted);display:block;margin-top:2px}
.opt .nums{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.opt .nums span{font-size:12px;background:var(--bg);border-radius:6px;padding:2px 8px}
.opt .nums span.red{background:var(--bad-soft);color:var(--bad)}
.opt .nums span.grn{background:var(--good-soft);color:var(--good)}
.opt.correct{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default;transform:none}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:10px 18px;font:inherit;font-weight:600;cursor:pointer}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:5px 10px;font-size:13px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:16px}
.box{border-radius:10px;padding:12px 14px;margin:12px 0;font-size:15px}
.box.good{background:var(--good-soft)} .box.bad{background:var(--bad-soft)} .box.warn{background:var(--warn-soft)} .box.note{background:var(--accent-soft)}
.math{font-family:Consolas,ui-monospace,monospace;font-size:14px;background:var(--bg);border-radius:10px;padding:12px;line-height:1.8;overflow-x:auto}
.bar{display:flex;height:26px;border-radius:8px;overflow:hidden;background:var(--bg)}
.bar div{height:100%;transition:width .5s}
.legend{display:grid;gap:4px;margin-top:10px;font-size:13px}
.legend div{display:flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;flex:none}
.legend span:last-child{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:600}
.hist{display:grid;gap:6px;font-size:12px}
.hist .bar{height:16px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-size:12px;text-transform:uppercase}
.tablewrap{overflow-x:auto}
input[type=text]{font:inherit;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
.setup{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:16px}
.setup .g{border:2px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:8px}
.setup .g b{display:flex;align-items:center;gap:6px}
.setup .g b i{width:12px;height:12px;border-radius:50%}
.setup label{font-size:12px;color:var(--muted)}
.tdot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.turn{border-left:6px solid;padding-left:16px}
.big{font-size:34px;font-weight:800;color:var(--accent)}
.podium{display:grid;gap:10px;margin:16px 0}
.podium .p{display:flex;align-items:center;gap:14px;border:2px solid var(--line);border-radius:12px;padding:12px 16px}
.podium .p .m{font-size:30px}
.podium .p .pn{font-weight:700;font-size:18px}
.podium .p .pv{margin-left:auto;text-align:right;font-weight:800;font-size:20px}
.podium .p.win{border-color:var(--good);background:var(--good-soft)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-start;justify-content:center;padding:30px 16px;overflow-y:auto;z-index:20}
.modal.open{display:flex}
.modal .card{max-width:820px;width:100%}
.gl dt{font-weight:700;margin-top:10px} .gl dd{margin:2px 0 0;color:var(--muted)}
.road{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin:16px 0}
.road div{background:var(--bg);border-radius:10px;padding:10px;font-size:13px;border-top:4px solid var(--accent)}
.road b{display:block;font-size:15px}
.flip{width:230px;height:280px;margin:18px auto;perspective:900px;cursor:pointer}
.fin{position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d}
.flip.on .fin{transform:rotateY(180deg)}
.flip:not(.on):hover .fin{transform:rotateY(12deg) scale(1.03)}
.ff,.fb{position:absolute;inset:0;border-radius:16px;backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:18px;text-align:center;box-shadow:var(--shadow)}
.ff{background:linear-gradient(135deg,var(--accent),#ec4899);color:#fff;font-size:80px;font-weight:800}
.ff small{font-size:14px;font-weight:600;opacity:.9}
.fb{transform:rotateY(180deg);border:2px solid var(--line)}
.fb b{font-size:17px} .fb span{font-size:14px;color:var(--muted)}
.timer{height:8px;border-radius:99px;background:var(--bg);overflow:hidden;margin:10px 0 4px}
.timer div{height:100%;background:var(--good);transition:width 1s linear,background .3s}
.tleft{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:30}
.fade{animation:f .3s ease}
@keyframes f{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<header>
  <div class="hwrap">
    <div class="logo">🚀 Startap <span>Sayohati</span></div>
    <div class="stats" id="stats"></div>
    <div class="hbtns">
      <button class="btn ghost sm" onclick="openModal('mRoad')">📋 Bosqichlar</button>
      <button class="btn ghost sm" onclick="openModal('mGloss')">📖 Lugʻat</button>
      <button class="btn ghost sm" id="snd" onclick="toggleSound()" title="Ovoz">🔊</button>
    </div>
  </div>
  <div class="teams" id="teams"></div>
</header>

<main>
  <section><div class="card fade" id="screen"></div></section>
  <aside class="side" id="side"></aside>
</main>

<div class="modal" id="mRoad" onclick="if(event.target===this)closeModal(this.id)"><div class="card">
  <div class="row" style="margin:0;justify-content:space-between"><h2>Startapni moliyalashtirish bosqichlari</h2><button class="btn ghost sm" onclick="closeModal('mRoad')">✕</button></div>
  <div id="roadTable"></div>
</div></div>

<div class="modal" id="mGloss" onclick="if(event.target===this)closeModal(this.id)"><div class="card">
  <div class="row" style="margin:0;justify-content:space-between"><h2>Venchur lugʻati</h2><button class="btn ghost sm" onclick="closeModal('mGloss')">✕</button></div>
  <dl class="gl" id="gloss"></dl>
</div></div>

<script>
/* ===================== MA'LUMOTLAR ===================== */
const TEAM_COLORS = ["#4f46e5","#e11d48","#059669"];
const COLORS = {
  "Asoschilar":"#4f46e5","Hammuassis":"#0ea5e9","FFF":"#f59e0b","Akselerator":"#f97316",
  "Biznes-farishtalar":"#eab308","Seed fond":"#84cc16","Opsion puli (ESOP)":"#a855f7",
  "Series A investor":"#10b981","Series B investor":"#14b8a6","Series C investor":"#06b6d4","Koʻprik investor":"#ef4444"
};

const GLOSSARY = [
  ["Venchur kapital (VC)","Yuqori xavfli, lekin tez oʻsish salohiyatiga ega yosh kompaniyalarga ulush evaziga kiritiladigan investitsiya."],
  ["Biznes-farishta (Angel)","Oʻz shaxsiy pulini ilk bosqichdagi startaplarga tikadigan tajribali shaxs. Koʻpincha mentorlik ham qiladi."],
  ["FFF","Friends, Family, Fools — doʻstlar, oila va 'telbalar'. Startapga eng birinchi pul beradigan, sizga ishonadigan odamlar."],
  ["Akselerator","Startaplarga kichik investitsiya, mentorlik va tarmoq beradigan qisqa muddatli dastur (masalan, Y Combinator, Techstars)."],
  ["Bootstrapping","Tashqi investitsiyasiz, faqat oʻz mablagʻi va daromad hisobiga rivojlanish."],
  ["Pre-money baholash","Investitsiya kiritilishidan OLDINGI kompaniya qiymati."],
  ["Post-money baholash","Investitsiyadan KEYINGI qiymat: Post-money = Pre-money + Investitsiya."],
  ["Suyultirish (Dilution)","Yangi aksiyalar chiqarilganda mavjud egalarning foiz ulushi kamayishi."],
  ["Cap table","Kompaniyada kim qancha ulushga egaligini koʻrsatuvchi jadval."],
  ["SAFE","Simple Agreement for Future Equity — kelgusida ulushga aylanadigan oddiy kelishuv. Baholashni keyingi raundga qoldiradi."],
  ["Konvertatsiyalanuvchi qarz","Keyingi raundda ulushga aylanadigan qarz (Convertible note), odatda foiz va chegirma bilan."],
  ["Term sheet","Investitsiya shartlari yozilgan asosiy hujjat: summa, baholash, imtiyozlar, boshqaruv huquqlari."],
  ["Due diligence","Investorning kompaniyani chuqur tekshiruvi: moliya, huquq, texnologiya, jamoa."],
  ["Liquidation preference","Sotilish/tugatishda investor avval oʻz pulini (yoki 2x, 3x) olishi huquqi. Qolganini boshqalar boʻladi."],
  ["Opsion puli (ESOP)","Xodimlarni ragʻbatlantirish uchun ajratiladigan aksiyalar ulushi (odatda 10–20%)."],
  ["Burn rate","Kompaniya oyiga qancha pul sarflashi."],
  ["Runway","Mavjud pul bilan kompaniya necha oy yashay olishi: Kassa ÷ Burn rate."],
  ["Product-Market Fit (PMF)","Mahsulot bozorning haqiqiy ehtiyojini qondirib, mijozlar uni oʻzi izlab kelayotgan holat."],
  ["Pivot","Bozordan olingan saboqlar asosida mahsulot yoki strategiya yoʻnalishini oʻzgartirish."],
  ["LTV / CAC","Mijozdan butun davr davomida olinadigan foyda (LTV) va uni jalb qilish xarajati (CAC) nisbati. ≥ 3 — yaxshi."],
  ["Up round / Down round","Yangi raunddagi baholash oldingisidan yuqori (up) yoki past (down) boʻlishi."],
  ["Koʻprik raund (Bridge)","Pul tugab qolganda keyingi raundgacha 'koʻprik' boʻluvchi, odatda noqulay shartli mablagʻ."],
  ["CVC","Corporate Venture Capital — yirik korporatsiyalarning venchur boʻlinmasi (strategik investor)."],
  ["Unicorn (Yagona shox)","1 mlrd dollardan yuqori baholangan xususiy startap."],
  ["Exit","Investorlar va asoschilar ulushini pulga aylantirishi: IPO yoki M&A (sotib olinish)."],
  ["IPO","Initial Public Offering — aksiyalarni birinchi marta birjada ommaga sotish."],
  ["Lock-up","IPO'dan keyin asoschi va investorlar aksiyani sota olmaydigan davr (odatda 6 oy)."],
  ["M&A","Mergers & Acquisitions — kompaniyani boshqa kompaniya sotib olishi yoki qoʻshilishi."],
  ["GP / LP","General Partner — fondni boshqaruvchi; Limited Partner — fondga pul qoʻyuvchi (pensiya fondlari, oilaviy ofislar)."],
  ["2 and 20","VC fondlarning odatiy haqi: yiliga 2% boshqaruv haqi va foydaning 20% (carry)."],
  ["Power law","VC qoidasi: fond daromadining katta qismini 1–2 ta juda muvaffaqiyatli startap beradi."]
];

const ROAD = [
  ["Pre-seed","$10 ming – $500 ming","Asoschi, FFF, akseleratorlar, farishtalar","Gʻoya, jamoa, prototip (MVP)","5–15%"],
  ["Seed","$500 ming – $3 mln","Biznes-farishtalar, seed fondlar","Mahsulot-bozor mosligini (PMF) topish","10–25%"],
  ["Series A","$2 mln – $15 mln","Venchur fondlar","Isbotlangan biznes modelni kengaytirish","15–25%"],
  ["Series B","$10 mln – $60 mln","Oʻsish (growth) fondlari, CVC","Bozorni egallash, jamoani oʻstirish","10–20%"],
  ["Series C+","$30 mln – $300 mln+","Kech bosqich fondlari, PE, xedj-fondlar","Global kengayish, IPO/M&A ga tayyorgarlik","5–15%"],
  ["Exit","—","Birja (IPO) yoki xaridor kompaniya (M&A)","Investorlar va asoschilar daromadni oladi","—"]

/* Bosqichlar (o'yin ssenariysi). Har bir bosqichda har bir guruhga alohida savol. */
const STAGES = [
{

      {t:"Frilanserga pul toʻlab MVP yaratamiz", d:"$15 ming sarflanadi, ulush saqlanadi.", fx:{trac:5, cash:-0.015},
       fb:"Tezkor yechim, lekin frilanser ketgach mahsulotni rivojlantirish qiyin. Investorlar 'texnik asoschi yoʻq' degan xavfni koʻradi."},
      {t:"Oʻzimiz dasturlashni oʻrganamiz", d:"Bepul, lekin sekin. 100% ulush jamoada qoladi.", fx:{trac:-5},
       fb:"Ulush saqlandi, ammo vaqt — startapning eng qimmat resursi. Raqobatchilar oldinga oʻtib ketishi mumkin."}
    ]
  },
  offers:[
    {name:"FFF raund", holder:"FFF", amount:0.05, fixedPct:10, d:"Qarindoshlar va doʻstlar $50 ming beradi, evaziga 10% ulush.", tags:["Tez va oson","Munosabatlar xavfi"]},
    {name:"Akseleratorga kirish", holder:"Akselerator", amount:0.15, fixedPct:7, trac:10, minTrac:45, d:"$150 ming, 7% ulush + 3 oylik mentorlik va Demo Day.", tags:["Mentorlik","Tarmoq (network)"]},
    {name:"Bootstrapping", holder:null, amount:0, d:"Tashqi pul olmaysiz. Xarajatni minimal qilib, ilk daromad hisobiga yashaysiz.", tags:["100% nazorat","Sekin oʻsish"], burnOverride:0.008, trac:-5}
  ],
  quizzes:[
    {q:"Startap dunyosidagi 'FFF' qisqartmasi nimani anglatadi?",
     opts:["Fast Funding Fund — tezkor fond","Friends, Family, Fools — doʻstlar, oila va 'telbalar'","Final Financing Form — yakuniy hujjat","Founder Fixed Fee — asoschi haqi"], a:1,
     ex:"FFF — sizga shaxsan ishonib, eng birinchi pul beradigan odamlar. Ular koʻpincha biznesni emas, sizni moliyalashtiradi."},
    {q:"'Bootstrapping' nima?",
     opts:["Faqat oʻz mablagʻi va daromad hisobiga, tashqi investitsiyasiz rivojlanish","Bankdan katta kredit olish","Akseleratorga kirish","Kompaniyani birinchi yilda sotish"], a:0,
     ex:"Bootstrapping nazoratni toʻliq saqlaydi, lekin oʻsish sekinroq boʻladi. Mailchimp va Zoho shunday oʻsgan mashhur misollar."},
    {q:"Akseleratorlar startapga odatda nima beradi?",
     opts:["Faqat bepul ofis","Kichik investitsiya, mentorlik va tarmoq — ulush evaziga","Ulushsiz, foizsiz kredit","Davlat litsenziyasi"], a:1,
     ex:"Y Combinator, Techstars kabi akseleratorlar 3 oylik dastur oxirida 'Demo Day' oʻtkazadi — u yerda startaplar investorlar oldida chiqish qiladi."}
  ]
},
{
  key:"Seed", title:"Urugʻ (Seed) raund", icon:"🌱", burn:0.8,
  intro:"Prototip tayyor, 20 ta doʻkon sinovdan oʻtkazmoqda. Endi mahsulot-bozor mosligini (PMF) topish va jamoani kengaytirish uchun jiddiyroq pul kerak.",
  info:{"Mablagʻ hajmi":"$500 ming – $3 mln","Kimlar beradi":"Biznes-farishtalar, seed fondlar, akseleratorlar","Instrumentlar":"SAFE, imtiyozli aksiyalar","Investor nimaga qaraydi":"Ilk traction, foydalanuvchilar oʻsishi, jamoa"},
  event:{
    q:"Mahsulotni qanday rivojlantirasiz?",
    opts:[
      {t:"Tezda MVP chiqarib, fikr yigʻamiz", d:"Kamchiliklari bor, lekin haqiqiy mijozlar ishlatadi.", fx:{trac:15},
       fb:"'Lean Startup' yondashuvi: Qur → Oʻlcha → Oʻrgan. Tez fikr olish — PMF ga eng qisqa yoʻl."},
      {t:"1 yil mukammal mahsulot ustida ishlaymiz", d:"Bozorga chiqmasdan, hamma narsani ideal qilamiz.", fx:{trac:-10, cash:-0.03},
       fb:"Xato! Startaplarning ~35% i 'bozorga keraksiz mahsulot' sabab yopiladi. Mijoz fikrisiz 'mukammal' mahsulot koʻpincha hech kimga kerak boʻlmaydi."},
      {t:"100 ta mijoz bilan suhbat, keyin pivot", d:"Muammoni chuqur oʻrganib, yoʻnalishni oʻzgartiramiz.", fx:{trac:8, rnd:[0,12]},
       fb:"Pivot — strategiyani oʻzgartirish. Slack, Instagram, YouTube ham pivot natijasida paydo boʻlgan."}
    ]

/* ===================== HOLAT ===================== */
let T = [], cur = 0, S = null;
function newTeam(i,name,members){
  return {i, name, members, color:TEAM_COLORS[i], stage:0, cash:0.02, trac:40, know:0, cap:{"Asoschilar":100},
          hist:[{label:"Start", cap:{"Asoschilar":100}}], lastPost:0, prefExtra:0, burnAdj:0, raised:0, log:[], turn:{}};
}

/* ===================== YORDAMCHILAR ===================== */
const $ = id => document.getElementById(id);
function money(m){
  if (m===0) return "$0";
  const neg = m<0; m=Math.abs(m); let s;
  if (m>=1000) s="$"+(m/1000).toFixed(2).replace(/\.?0+$/,"")+" mlrd";
  else if (m>=1) s="$"+(m>=100?m.toFixed(0):m.toFixed(1).replace(/\.0$/,""))+" mln";
  else s="$"+Math.round(m*1000)+" ming";
  return (neg?"−":"")+s;
}
const pct = x => (Math.round(x*10)/10).toFixed(1)+"%";
const clamp = (x,a,b)=>Math.max(a,Math.min(b,x));
const rnd = (a,b)=>a+Math.random()*(b-a);
const mult = ()=>0.5+S.trac/100;
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const tname = t => `<span class="tdot" style="background:${t.color}"></span>${esc(t.name)}`;
function dilute(holder,p){
  for (const k in S.cap) S.cap[k]*= (1-p/100);
  S.cap[holder]=(S.cap[holder]||0)+p;
}
function snap(label){ S.hist.push({label, cap:{...S.cap}}); }
const own = t => t.cap["Asoschilar"];
function me(){ return own(S); }
function addTrac(x){ S.trac = clamp(S.trac + x, 5, 100); }

function offerCalc(o){
  if (o.amount===0) return {pre:S.lastPost, post:S.lastPost, p:0};
  if (o.fixedPct){ const post=o.amount/(o.fixedPct/100); return {pre:post-o.amount, post, p:o.fixedPct}; }
  const pre = Math.round(o.pre*mult()*10)/10, post = pre+o.amount;
  return {pre, post, p:o.amount/post*100};
}

/* ===================== RENDER ===================== */
function renderTeams(){
  $("teams").innerHTML = T.map((t,i)=>`<div class="team ${S&&i===cur?'now':''}" style="border-color:${S&&i===cur?t.color:'var(--line)'}">
    <div class="tn"><i style="background:${t.color}"></i>${esc(t.name)}</div>
    ${t.members?`<div class="tm" title="${esc(t.members)}">👥 ${esc(t.members)}</div>`:""}
    <div class="ts">👤 ${pct(own(t))} · 🏷️ ${t.lastPost?money(t.lastPost):"—"} · 🎓 ${t.know}</div></div>`).join("");
}
function renderStats(){
  if(!S){ $("stats").innerHTML=""; return; }
  $("stats").innerHTML = `
    <div class="chip" style="border-color:${S.color}">${tname(S)}</div>
    <div class="chip">💰 Kassa: <b>${money(S.cash)}</b></div>
    <div class="chip">🏷️ Baholash: <b>${S.lastPost?money(S.lastPost):"—"}</b></div>
    <div class="chip">👤 Ulush: <b>${pct(me())}</b></div>
    <div class="chip">📊 Rivojlanish: <b>${Math.round(S.trac)}/100</b></div>
    <div class="chip">🎓 Bilim: <b>${S.know}/${STAGES.length}</b></div>`;
}
function capBar(cap){
  return `<div class="bar">${Object.entries(cap).filter(e=>e[1]>0.05).map(([k,v])=>`<div title="${k}: ${pct(v)}" style="width:${v}%;background:${COLORS[k]||'#888'}"></div>`).join("")}</div>`;
}
function scoreboard(){
  return `<div class="card"><h3>🏁 Guruhlar reytingi</h3><div class="tablewrap"><table>
    <tr><th>Guruh</th><th>Ulush</th><th>Baholash</th><th>🎓</th></tr>
    ${T.map((t,i)=>`<tr style="${S&&i===cur?'font-weight:700':''}"><td>${tname(t)}</td><td>${pct(own(t))}</td><td>${t.lastPost?money(t.lastPost):"—"}</td><td>${t.know}</td></tr>`).join("")}
  </table></div><p class="muted" style="font-size:12px;margin-bottom:0">Ulush qiymati = Ulush × Baholash. Gʻolib — exitda eng koʻp pul olgan guruh.</p></div>`;
}
function renderSide(){
  if(!S){ $("side").innerHTML = sideIntro(); return; }
  const legend = Object.entries(S.cap).sort((a,b)=>b[1]-a[1]).filter(e=>e[1]>0.05)
    .map(([k,v])=>`<div><i style="background:${COLORS[k]||'#888'}"></i><span>${k}</span><span>${pct(v)}</span></div>`).join("");
  const hist = S.hist.map(h=>`<div>${h.label}${capBar(h.cap)}</div>`).join("");
  $("side").innerHTML = scoreboard() + `
    <div class="card"><h3>📑 Cap table: ${tname(S)}</h3>${capBar(S.cap)}<div class="legend">${legend}</div></div>
    <div class="card"><h3>📉 Ulushlar tarixi</h3><div class="hist">${hist}</div>
      <p class="muted" style="font-size:13px">Har bir raundda yangi aksiyalar chiqariladi — bu <b>suyultirish</b>. Ulush foizi kamayadi, lekin kompaniya qiymati oshsa, ulush qiymati oʻsadi.</p></div>`;
}
function sideIntro(){

}
function steps(){

function turnTag(label){ return `<span class="tag" style="background:${S.color};color:#fff">${esc(S.name)}</span> <span class="tag">${label}</span>`; }
function show(html){ const el=$("screen"); el.classList.remove("fade"); void el.offsetWidth; el.classList.add("fade"); el.innerHTML=html; renderTeams(); renderStats(); renderSide(); window.scrollTo({top:0,behavior:"smooth"}); }

}

  show(`${steps()}<span class="tag">${S.stage+1}-bosqich · barcha guruhlar uchun</span>
    <h2>${st.icon} ${st.key}: ${st.title}</h2>
    <p>${st.intro}</p>

}
function turnStart(){

    <h1 style="margin-top:8px">🎯 Navbat: ${esc(S.name)}</h1>
    ${S.members?`<p style="font-size:18px">👥 ${esc(S.members)}</p>`:""}

    <div class="row"><button class="btn" style="background:${S.color};color:#fff" onclick="${st.exit?'exitChoice()':'eventQ()'}">Tayyormiz! ▶</button></div>`);
}

function eventQ(){
  const st = STAGES[S.stage];
  show(`${steps()}${turnTag("Strategik qaror")}<h2 style="margin-top:8px">🤔 ${st.event.q}</h2>
    <div class="opts">${st.event.opts.map((o,i)=>`<button class="opt" onclick="eventPick(${i})"><span class="t">${o.t}</span><span class="d">${o.d}</span></button>`).join("")}</div>`);
}
function eventPick(i){
  const o = STAGES[S.stage].event.opts[i], fx=o.fx; let dt = fx.trac||0;
  if (fx.rnd) dt += Math.round(rnd(fx.rnd[0],fx.rnd[1]));
  addTrac(dt);
  if (fx.cash) S.cash += fx.cash;
  S.burnAdj = fx.burnAdj||0;
  S.turn = {event:o.t, dt};
  let extra="";
  if (fx.holder){ dilute(fx.holder[0],fx.holder[1]); extra=`<br>👥 ${fx.holder[0]} ${fx.holder[1]}% ulush oldi.`; }
  if (fx.cash) extra += `<br>💸 Xarajat: ${money(-fx.cash)}`;
  if (S.burnAdj) extra += `<br>🔥 Bu bosqichdagi xarajat ${S.burnAdj>0?"+":""}${money(S.burnAdj)} ga oʻzgaradi.`;
  show(`${steps()}${turnTag("Natija")}<h2 style="margin-top:8px">${o.t}</h2>
    <div class="box ${dt>=5?'good':dt<0?'bad':'warn'}"><b>Rivojlanish: ${dt>=0?"+":""}${dt}</b>${extra}</div>
    <p>${o.fb}</p>
    <div class="row"><button class="btn" onclick="luckCard()">🎲 Tasodif kartasini olish →</button></div>`);
}

/* ===================== TASODIF KARTASI ===================== */
const LUCK = [
  {e:"🎤", t:"Mashhur blogger ilovangizni maqtadi!", d:"Bir kunda 10 000 yangi foydalanuvchi.", trac:10},
  {e:"🏅", t:"Startap tanlovida gʻolib boʻldingiz!", d:"Mukofot puli va OAV'da shuhrat.", trac:5, cashK:0.08},
  {e:"🏛️", t:"Davlat granti!", d:"IT Park dasturi orqali grant olindi.", cashK:0.12},
  {e:"🤝", t:"Yirik hamkorlik", d:"Mashhur supermarket tarmogʻi platformangizga ulandi.", trac:8},
  {e:"📰", t:"Forbes'da maqola", d:"Investorlar sizni oʻzlari izlay boshladi.", trac:6},
  {e:"💥", t:"Server qulab tushdi!", d:"Bayram kuni 6 soat ishlamadingiz. Mijozlar gʻazabda.", trac:-8},
  {e:"🏃", t:"Bosh dasturchi raqobatchiga ketdi", d:"Yangi odam topish va oʻrgatish kerak.", trac:-6, cashK:-0.05},
  {e:"⚖️", t:"Sud jarayoni", d:"Raqobatchi patent boʻyicha da'vo qildi. Advokatlarga pul ketdi.", cashK:-0.08},
  {e:"🦠", t:"Bozorda kutilmagan inqiroz", d:"Doʻkonlar xarajatlarni qisqartirmoqda.", trac:-5},
  {e:"🍀", t:"Hech narsa boʻlmadi", d:"Tinch oy. Jamoa ishda davom etmoqda.", trac:0},
  {e:"🚀", t:"Mahsulot viral boʻldi!", d:"TikTok'dagi video 5 mln koʻrildi.", trac:12},
  {e:"🕵️", t:"Maʼlumotlar sizib chiqdi", d:"Xavfsizlik teshigi topildi, jarima va obroʻ yoʻqotish.", trac:-7, cashK:-0.04}
];
function luckCard(){
  show(`${steps()}${turnTag("🎲 Tasodif kartasi")}<h2 style="margin-top:8px">Startap hayoti kutilmagan voqealarga toʻla!</h2>
    <p class="muted">Kartani bosib oching. Omad kulib boqadimi?</p>
    <div class="flip" id="flip" onclick="flipCard()"><div class="fin"><div class="ff">❓<small>Bosing</small></div><div class="fb" id="fb"></div></div></div>
    <div id="lres"></div>`);
}
function flipCard(){
  const f=$("flip"); if (f.classList.contains("on")) return;
  const c = LUCK[Math.floor(Math.random()*LUCK.length)];
  const scale = Math.max(0.25, S.lastPost/3);           // pul effekti kompaniya hajmiga mos
  let cash = c.cashK ? Math.round(c.cashK*scale*1000)/1000 : 0;
  if (c.trac) addTrac(c.trac);
  if (cash){ const was=S.cash; S.cash = Math.max(0, S.cash + cash); cash = S.cash - was; }
  const good = (c.trac||0) + cash*10 > 0, bad = (c.trac||0) + cash*10 < 0;
  $("fb").innerHTML = `<div style="font-size:54px">${c.e}</div><b>${c.t}</b><span>${c.d}</span>`;
  $("fb").style.background = good?"var(--good-soft)":bad?"var(--bad-soft)":"var(--bg)";
  f.classList.add("on"); sfx(good?"good":bad?"bad":"tick");
  setTimeout(()=>{
    if (!$("lres")) return;
    $("lres").innerHTML = `<div class="box ${good?'good':bad?'bad':'warn'}">${c.trac?`📊 Rivojlanish: <b>${c.trac>0?"+":""}${c.trac}</b> `:""}${cash?` 💰 Kassa: <b>${cash>0?"+":""}${money(cash)}</b>`:""}${!c.trac&&!cash?"Oʻzgarish yoʻq.":""}</div>
      <div class="row"><button class="btn" onclick="offers()">Investorlar bilan uchrashish →</button></div>`;
    renderTeams(); renderStats();
  }, 650);
}

function offers(){
  const st = STAGES[S.stage];
  const list = st.offers.map((o,i)=>{
    const c = offerCalc(o);
    const locked = o.minTrac && S.trac<o.minTrac;
    const down = S.lastPost && o.amount && c.pre < S.lastPost;
    const nums = o.amount===0 ? `<span class="grn">Ulush: 0%</span><span>Pul: $0</span>`
      : `<span>Investitsiya: <b>${money(o.amount)}</b></span><span>Pre-money: ${money(c.pre)}</span><span>Post-money: ${money(c.post)}</span><span class="red">Beriladigan ulush: ${pct(c.p)}</span>${o.pref>1?`<span class="red">${o.pref}x imtiyoz</span>`:""}${down?`<span class="red">⚠ DOWN ROUND</span>`:S.lastPost&&o.amount?`<span class="grn">▲ Up round</span>`:""}`;
    return `<button class="opt" ${locked?"disabled style='opacity:.5'":""} onclick="takeOffer(${i})"><span class="t">${o.name}</span><span class="d">${o.d}</span>
      <span class="nums">${nums}${(o.tags||[]).map(t=>`<span>${t}</span>`).join("")}</span>
      ${locked?`<span class="d" style="color:var(--bad)">🔒 Akselerator rad etdi: rivojlanish kamida ${o.minTrac} boʻlishi kerak (sizda ${Math.round(S.trac)}).</span>`:""}</button>`;
  }).join("");
  const burn = (st.burn + S.burnAdj);
  show(`${steps()}${turnTag("Term sheet")}<h2 style="margin-top:8px">💼 Investorlar takliflari</h2>
    <p class="muted">Baholash rivojlanish darajangizga bogʻliq (${Math.round(S.trac)}/100 → koeffitsiyent ×${mult().toFixed(2)}). Keyingi bosqichgacha taxminan <b>${money(burn)}</b> sarflanadi — pul yetmasa, noqulay koʻprik raund olishga majbur boʻlasiz.</p>
    <div class="opts">${list}</div>`);
}

function takeOffer(i){
  const st = STAGES[S.stage], o = st.offers[i];
  const before = me(); let notes = [];
  if (st.esop){ dilute("Opsion puli (ESOP)", st.esop);
    notes.push(`<div class="box note">🎁 <b>Opsion puli:</b> Investor xodimlar uchun ${st.esop}% ESOP yaratishni talab qildi. U investitsiyadan <i>oldin</i> (pre-money) yaratildi, shuning uchun faqat mavjud egalar suyultirildi. Ulush: ${pct(before)} → ${pct(me())}</div>`); }
  const mid = me(); const c = offerCalc(o);
  let math="";
  if (o.amount>0){
    dilute(o.holder, c.p);
    S.cash += o.amount; S.raised += o.amount; S.lastPost = c.post;
    if (o.pref>1) S.prefExtra += (o.pref-1)*o.amount;
    math = `<div class="math">Post-money = Pre-money + Investitsiya = ${money(c.pre)} + ${money(o.amount)} = <b>${money(c.post)}</b><br>
      Investor ulushi = ${money(o.amount)} ÷ ${money(c.post)} = <b>${pct(c.p)}</b><br>
      Guruh ulushi = ${pct(mid)} × (1 − ${pct(c.p)}) = <b>${pct(me())}</b><br>
      Ulush qiymati = ${pct(me())} × ${money(c.post)} = <b>${money(me()/100*c.post)}</b></div>`;
  } else {
    math = `<div class="box good">Hech qanday ulush berilmadi — 100% nazorat saqlanib qoldi. Lekin oʻsish sekinlashdi.</div>`;
  }
  if (o.trac) addTrac(o.trac);
  if (o.pref>1) notes.push(`<div class="box warn">⚠ <b>${o.pref}x imtiyoz:</b> Exitda bu investor boshqalardan oldin ${money(o.amount*o.pref)} oladi. Bu guruhning yakuniy daromadini kamaytiradi.</div>`);
  const burn = o.burnOverride ?? (st.burn + S.burnAdj);
  S.cash -= burn;
  notes.push(`<div class="box note">🔥 Keyingi bosqichgacha sarflandi: <b>${money(burn)}</b>. Kassada qoldi: <b>${money(Math.max(S.cash,0))}</b></div>`);
  let bridge=false;
  if (S.cash < 0){
    const short = -S.cash; bridge=true;
    dilute("Koʻprik investor", 8); addTrac(-5); S.cash = 0;
    notes.push(`<div class="box bad">🚨 <b>Pul tugadi!</b> ${money(short)} yetishmadi. Kompaniyani saqlab qolish uchun noqulay <b>koʻprik raund</b> olindi: 8% ulush berildi, rivojlanish −5. <br>Saboq: har doim kamida 18–24 oylik <i>runway</i> bilan pul jalb qiling.</div>`);
  }
  if (S.lastPost >= 1000 && !S.unicorn){ S.unicorn=true; notes.push(`<div class="box good">🦄 <b>Tabriklaymiz!</b> Kompaniya baholashi $1 mlrd dan oshdi — ${esc(S.name)} endi <b>unicorn</b>!</div>`); }
  snap(st.key);
  S.turn.offer = o.name; S.turn.bridge = bridge;
  S.log.push({stage:st.key, offer:o.name, amount:o.amount, post:S.lastPost, me:me()});
  show(`${steps()}${turnTag("Raund yopildi")}<h2 style="margin-top:8px">✅ ${o.name}</h2>${math}${notes.join("")}
    <div class="row"><button class="btn" onclick="quiz()">Bilim savoli (${QUIZ_SEC} soniya) →</button></div>`);
  if (S.unicorn && !S.unicornShown){ S.unicornShown=true; confetti(); sfx("win"); } else sfx(bridge?"bad":"tick");
}

const QUIZ_SEC = 30; let qTimer = null;
function quiz(){
  const q = STAGES[S.stage].quizzes[cur];
  show(`${steps()}${turnTag("🎓 Bilim savoli")}<h2 style="margin-top:8px">${q.q}</h2>
    <div class="timer"><div id="tbar" style="width:100%"></div></div><div class="tleft" id="tleft">⏱ ${QUIZ_SEC} soniya</div>
    <div class="opts" id="qopts">${q.opts.map((o,i)=>`<button class="opt" onclick="answer(${i})"><span class="t">${String.fromCharCode(65+i)}) ${o}</span></button>`).join("")}</div><div id="qfb"></div>`);
  let left = QUIZ_SEC; clearInterval(qTimer);
  qTimer = setInterval(()=>{
    left--; const b=$("tbar"); if(!b){ clearInterval(qTimer); return; }
    b.style.width = (left/QUIZ_SEC*100)+"%";
    b.style.background = left<=5?"var(--bad)":left<=12?"var(--warn)":"var(--good)";
    $("tleft").textContent = `⏱ ${left} soniya`;
    if (left<=5 && left>0) sfx("tick");
    if (left<=0) answer(-1);
  },1000);
}
function answer(i){
  clearInterval(qTimer);
  const q = STAGES[S.stage].quizzes[cur], ok = i===q.a;
  if (ok) S.know++;
  S.turn.quiz = ok; sfx(ok?"good":"bad");
  if (i===-1) $("tleft").textContent = "⏰ Vaqt tugadi!";
  [...$("qopts").children].forEach((b,j)=>{ b.disabled=true; if(j===q.a) b.classList.add("correct"); else if(j===i) b.classList.add("wrong"); });
  const exit = STAGES[S.stage].exit;
  const label = cur<T.length-1 ? `Navbat: ${esc(T[cur+1].name)} →` : exit ? "Yakuniy natijalar 🏁" : "Bosqich yakuni 📊";
  $("qfb").innerHTML = `<div class="box ${ok?'good':'bad'}"><b>${ok?"✔ Toʻgʻri! +1 bilim":"✘ Notoʻgʻri."}</b> ${q.ex}</div>
    <div class="row"><button class="btn" onclick="nextTurn()">${label}</button></div>`;
  renderTeams(); renderStats(); renderSide();
}
function nextTurn(){
  if (cur < T.length-1){ cur++; S=T[cur]; turnStart(); return; }
  if (STAGES[S.stage].exit) return final();
  stageSummary();
}
function stageSummary(){
  const st = STAGES[S.stage];
  const rows = T.map(t=>`<tr><td>${tname(t)}</td><td>${t.turn.event||"—"}</td><td>${t.turn.offer||"—"}${t.turn.bridge?" <span style='color:var(--bad)'>+ koʻprik</span>":""}</td>
    <td>${t.lastPost?money(t.lastPost):"—"}</td><td>${pct(own(t))}</td><td>${money(own(t)/100*t.lastPost)}</td><td>${t.turn.quiz?"✔":"✘"}</td></tr>`).join("");
  const lead = [...T].sort((a,b)=>own(b)*b.lastPost-own(a)*a.lastPost)[0];
  show(`${steps()}<span class="tag">${st.icon} ${st.key} yakunlandi</span><h2 style="margin-top:8px">📊 Bosqich natijalari</h2>
    <div class="tablewrap"><table><tr><th>Guruh</th><th>Qaror</th><th>Investor</th><th>Baholash</th><th>Ulush</th><th>Ulush qiymati</th><th>Savol</th></tr>${rows}</table></div>
    ${lead.lastPost?`<div class="box good">🥇 Hozircha yetakchi: <b>${tname(lead)}</b> — ulush qiymati ${money(own(lead)/100*lead.lastPost)}</div>`:""}
    <p class="muted">Muhokama uchun: nega guruhlarning ulushi va baholashi farq qildi? Qaysi qaror eng toʻgʻri boʻldi?</p>
    <div class="row"><button class="btn" onclick="nextStage()">Keyingi bosqich: ${STAGES[S.stage+1].key} →</button></div>`);
}
function nextStage(){ T.forEach(t=>{ t.stage++; t.burnAdj=0; t.turn={}; }); cur=0; S=T[0]; stageInfo(); }

/* ===================== EXIT ===================== */
function exitChoice(){
  const b = Math.max(S.lastPost, 1), t=S.trac;
  S.exitOpts = {
    ma:  Math.round(b*(0.7+t/100)*10)/10,
    ipoLo: Math.round(b*(0.5+t/50)*0.7), ipoHi: Math.round(b*(0.5+t/50)*1.4),
    ipoFail: Math.round(clamp((60-t)/100,0.05,0.6)*100)
  };
  const E=S.exitOpts;
  show(`${steps()}${turnTag("Exit")}<h2 style="margin-top:8px">🏆 Qaysi yoʻl bilan chiqasiz?</h2>
    <p class="muted">Oxirgi baholash: <b>${money(S.lastPost)}</b>. Rivojlanish: ${Math.round(t)}/100. Investorlarning qoʻshimcha imtiyozlari: <b>${money(S.prefExtra)}</b> (ular birinchi toʻlanadi).</p>
    <div class="opts">
      <button class="opt" onclick="doExit('ipo')"><span class="t">🔔 IPO — birjaga chiqish</span><span class="d">Eng katta daromad imkoniyati, lekin bozor kayfiyatiga bogʻliq. Muvaffaqiyatsizlik ehtimoli: ${E.ipoFail}%.</span><span class="nums"><span>Kutilgan qiymat: ${money(E.ipoLo)} – ${money(E.ipoHi)}</span></span></button>
      <button class="opt" onclick="doExit('ma')"><span class="t">🤝 M&A — yirik kompaniyaga sotish</span><span class="d">Xalqaro texnologiya giganti kompaniyani sotib olishni taklif qilmoqda. Narx kafolatlangan.</span><span class="nums"><span class="grn">Taklif: ${money(E.ma)}</span></span></button>
      <button class="opt" onclick="doExit('hold')"><span class="t">🧭 Mustaqil qolish</span><span class="d">Sotmaysiz, kompaniyani yana 5 yil boshqarasiz. Natija juda noaniq — ham katta yutuq, ham yoʻqotish boʻlishi mumkin.</span></button>
    </div>`);
}
function doExit(kind){
  const b=Math.max(S.lastPost,1), t=S.trac; let val, story;
  if (kind==="ma"){ val=S.exitOpts.ma; story="🤝 Kompaniya muvaffaqiyatli sotildi! Bitim 6 oylik due diligence'dan soʻng yopildi."; }
  else if (kind==="ipo"){
    if (Math.random()*100 < S.exitOpts.ipoFail){ val=Math.round(b*0.4); story="😬 IPO kuni bozor qulab tushdi. Aksiyalar kutilganidan ancha past narxda joylashtirildi."; }
    else { val=Math.round(b*(0.5+t/50)*rnd(0.7,1.4)); story="🔔 Qoʻngʻiroq chalindi! Aksiyalar birjada savdoga chiqdi. (Haqiqiy IPO'da asoschilar odatda 6 oylik lock-up davrida aksiyani sota olmaydi.)"; }
  } else {
    const r=rnd(0.4,1.6); val=Math.round(b*(0.4+t/60)*r);
    story = r>1.1 ? "📈 Kompaniya barqaror oʻsdi va qiymati sezilarli oshdi!" : r<0.8 ? "📉 Yangi raqobatchilar paydo boʻldi, qiymat pasaydi." : "🧭 Kompaniya oʻrtacha sur'atda rivojlandi.";
  }
  const payout = own(S)/100*Math.max(0, val - S.prefExtra);
  S.exit={kind,val,story,payout};
  S.turn = {event:{ipo:"IPO",ma:"M&A",hold:"Mustaqil qolish"}[kind]};
  show(`${steps()}${turnTag("Exit natijasi")}<h2 style="margin-top:8px">${story}</h2>
    <div class="math">Exit qiymati: <b>${money(val)}</b><br>
      Imtiyozli investorlarga avval: ${money(S.prefExtra)}<br>
      Guruh daromadi = ${pct(own(S))} × (${money(val)} − ${money(S.prefExtra)}) = <b>${money(payout)}</b></div>
    <div class="row"><button class="btn" onclick="quiz()">Oxirgi bilim savoli →</button></div>`);
}

function rankOf(p){
  return p>=200?"🦄 Afsonaviy asoschilar":p>=50?"🚀 Seriyali tadbirkorlar":p>=10?"💼 Muvaffaqiyatli asoschilar":p>=1?"🌱 Tajribali asoschilar":"📚 Oʻrganuvchilar";
}
function final(){
  const order = [...T].sort((a,b)=>b.exit.payout-a.exit.payout);
  const medals = ["🥇","🥈","🥉"];
  const smart = Math.max(...T.map(t=>t.know));
  const smartTeams = T.filter(t=>t.know===smart).map(t=>esc(t.name)).join(", ");
  S=null; $("stats").innerHTML="";
  const pod = order.map((t,i)=>`<div class="p ${i===0?'win':''}" style="border-left:6px solid ${t.color}">
      <div class="m">${medals[i]}</div>
      <div><div class="pn">${esc(t.name)}</div>${t.members?`<div class="muted" style="font-size:13px">👥 ${esc(t.members)}</div>`:""}
        <div class="muted" style="font-size:13px">${rankOf(t.exit.payout)} · ${t.turn.event} · ulush ${pct(own(t))} · 🎓 ${t.know}/${STAGES.length}</div></div>
      <div class="pv">${money(t.exit.payout)}<div class="muted" style="font-size:12px;font-weight:400">exit: ${money(t.exit.val)}</div></div></div>`).join("");
  const journey = T.map(t=>`<h3 style="margin-top:18px">${tname(t)}</h3>${capBar(t.cap)}
    <div class="tablewrap"><table><tr><th>Bosqich</th><th>Investor</th><th>Summa</th><th>Post-money</th><th>Ulush</th></tr>
    ${t.log.map(l=>`<tr><td>${l.stage}</td><td>${l.offer}</td><td>${l.amount?money(l.amount):"—"}</td><td>${l.post?money(l.post):"—"}</td><td>${pct(l.me)}</td></tr>`).join("")}</table></div>`).join("");
  show(`<span class="tag">Oʻyin yakuni</span><h1 style="margin-top:8px">🏆 Gʻolib: ${esc(order[0].name)}!</h1>
    <div class="podium">${pod}</div>
    <div class="box note">🎓 <b>Eng bilimdon guruh:</b> ${smartTeams} (${smart}/${STAGES.length} toʻgʻri javob)</div>
    <p class="muted">Daromad = Guruh ulushi × (Exit qiymati − investorlarning qoʻshimcha imtiyozlari)</p>
    <h2 style="margin-top:20px">📜 Guruhlarning moliyalashtirish yoʻli</h2>${journey}
    <h2 style="margin-top:20px">💡 Asosiy saboqlar</h2>
    <ul>
      <li>Har bir raund ulushni <b>suyultiradi</b> — lekin "katta pirogning kichik boʻlagi kichik pirogning katta boʻlagidan yaxshiroq".</li>
      <li><b>Eng yuqori baholash har doim eng yaxshi taklif emas</b>: 2x imtiyoz va nazorat talablari exitda qimmatga tushadi.</li>
      <li><b>Runway</b>ni nazorat qiling: pul tugasa, noqulay shartlarga rozi boʻlishga majbur boʻlasiz.</li>
      <li>Investorlar avvalo <b>jamoa</b> va <b>tez oʻrganish</b> qobiliyatiga pul tikadi.</li>
    </ul>
    <div class="row"><button class="btn" onclick="home()">🔄 Yangi oʻyin</button><button class="btn ghost" onclick="openModal('mRoad')">📋 Bosqichlar jadvali</button></div>`);
  confetti(); sfx("win");
  $("side").innerHTML = `<div class="card"><h3>🏁 Yakuniy reyting</h3><table>${order.map((t,i)=>`<tr><td>${medals[i]}</td><td>${tname(t)}</td><td><b>${money(t.exit.payout)}</b></td></tr>`).join("")}</table></div>`;
}

/* ===================== OVOZ VA KONFETTI ===================== */
let soundOn = true, actx = null;
function toggleSound(){ soundOn=!soundOn; $("snd").textContent = soundOn?"🔊":"🔇"; }
function sfx(kind){
  if (!soundOn) return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const notes = {good:[523,659,784], bad:[300,220], tick:[880], win:[523,659,784,1047]}[kind]||[440];
    notes.forEach((f,i)=>{
      const o=actx.createOscillator(), g=actx.createGain(), t=actx.currentTime+i*0.11;
      o.type = kind==="bad"?"sawtooth":"triangle"; o.frequency.value=f;
      g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(kind==="tick"?0.05:0.15,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+0.25);
      o.connect(g).connect(actx.destination); o.start(t); o.stop(t+0.3);
    });
  }catch(e){}
}
function confetti(){
  const c=document.createElement("canvas"); c.id="confetti"; document.body.appendChild(c);
  const x=c.getContext("2d"); c.width=innerWidth; c.height=innerHeight;
  const cols=["#4f46e5","#e11d48","#059669","#f59e0b","#0ea5e9","#a855f7"];
  const ps=Array.from({length:180},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height,vx:rnd(-1.5,1.5),vy:rnd(2,5),r:rnd(0,6.28),vr:rnd(-.2,.2),s:rnd(6,11),c:cols[Math.floor(Math.random()*cols.length)]}));
  let n=0; (function loop(){
    x.clearRect(0,0,c.width,c.height);
    ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore();});
    if(++n<260) requestAnimationFrame(loop); else c.remove();
  })();
}
